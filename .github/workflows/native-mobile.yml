name: Native mobile
on:
  pull_request:
    paths: ['apps/mobile/android/**', 'apps/mobile/ios/**', 'fixtures/mobile-contract/**']
  push:
    branches: [main]
permissions:
  contents: read
jobs:
    android:
    runs-on: ubuntu-latest
    env:
      GOOGLE_SERVICES_JSON: apps/mobile/google-services.json
      EXPO_PUBLIC_FIREBASE_API_KEY: ${{ secrets.EXPO_PUBLIC_FIREBASE_API_KEY }}
      EXPO_PUBLIC_FIREBASE_AUTH_DOMAIN: ${{ secrets.EXPO_PUBLIC_FIREBASE_AUTH_DOMAIN }}
      EXPO_PUBLIC_FIREBASE_PROJECT_ID: ${{ secrets.EXPO_PUBLIC_FIREBASE_PROJECT_ID }}
      EXPO_PUBLIC_FIREBASE_STORAGE_BUCKET: ${{ secrets.EXPO_PUBLIC_FIREBASE_STORAGE_BUCKET }}
      EXPO_PUBLIC_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.EXPO_PUBLIC_FIREBASE_MESSAGING_SENDER_ID }}
      EXPO_PUBLIC_FIREBASE_APP_ID: ${{ secrets.EXPO_PUBLIC_FIREBASE_APP_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - name: Restore environment Firebase configuration
        run: echo "$GOOGLE_SERVICES_JSON" | base64 --decode > apps/mobile/android/app/google-services.json
        env: { GOOGLE_SERVICES_JSON: '${{ secrets.ANDROID_GOOGLE_SERVICES_JSON }}' }
      - run: apps/mobile/android/gradlew -p apps/mobile/android :app:testDebugUnitTest :app:assembleDebug
  ios:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - run: xcodebuild test -project apps/mobile/ios/TennisScoring.xcodeproj -scheme TennisScoring -destination 'platform=iOS Simulator,name=iPhone 16'
