name: Native mobile

on:
  pull_request:
    paths:
      - 'apps/mobile/android/**'
      - 'apps/mobile/ios/**'
      - 'fixtures/mobile-contract/**'
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-latest
    env:
      NODE_ENV: production
      GOOGLE_SERVICES_JSON: apps/mobile/google-services.json
      EXPO_PUBLIC_FIREBASE_API_KEY: ${{ secrets.EXPO_PUBLIC_FIREBASE_API_KEY }}
      EXPO_PUBLIC_FIREBASE_AUTH_DOMAIN: ${{ secrets.EXPO_PUBLIC_FIREBASE_AUTH_DOMAIN }}
      EXPO_PUBLIC_FIREBASE_PROJECT_ID: ${{ secrets.EXPO_PUBLIC_FIREBASE_PROJECT_ID }}
      EXPO_PUBLIC_FIREBASE_STORAGE_BUCKET: ${{ secrets.EXPO_PUBLIC_FIREBASE_STORAGE_BUCKET }}
      EXPO_PUBLIC_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.EXPO_PUBLIC_FIREBASE_MESSAGING_SENDER_ID }}
      EXPO_PUBLIC_FIREBASE_APP_ID: ${{ secrets.EXPO_PUBLIC_FIREBASE_APP_ID }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 9.15.5

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: '.nvmrc'
          cache: pnpm

      - name: Install JavaScript dependencies
        run: pnpm install --frozen-lockfile

      - name: Build mobile workspace dependencies
        run: |
          pnpm --filter @tennis/shared build
          pnpm --filter @tennis/firebase-client build

      - name: Restore Android Firebase configuration
        env:
          ANDROID_GOOGLE_SERVICES_JSON: ${{ secrets.ANDROID_GOOGLE_SERVICES_JSON }}
        run: |
          set -euo pipefail

          if [ -z "$ANDROID_GOOGLE_SERVICES_JSON" ]; then
            echo "::error::ANDROID_GOOGLE_SERVICES_JSON is not configured."
            exit 1
          fi

          mkdir -p "$(dirname "$GOOGLE_SERVICES_JSON")"
          printf '%s' "$ANDROID_GOOGLE_SERVICES_JSON" \
            | base64 --decode \
            > "$GOOGLE_SERVICES_JSON"

          test -s "$GOOGLE_SERVICES_JSON"

      - name: Run Android unit tests and assemble debug APK
        run: |
          apps/mobile/android/gradlew \
            -p apps/mobile/android \
            :app:testDebugUnitTest \
            :app:assembleDebug

  ios:
    runs-on: macos-15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Run iOS tests
        run: |
          xcodebuild test \
            -project apps/mobile/ios/TennisScoring.xcodeproj \
            -scheme TennisScoring \
            -destination 'platform=iOS Simulator,name=iPhone 16'
