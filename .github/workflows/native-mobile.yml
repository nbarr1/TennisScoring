name: Native iOS

# The Swift TennisKit package's tests and a typecheck of the iOS and watchOS app
# sources: the one native signal ci.yml cannot give, because it needs macOS.
#
# This file used to carry two more jobs. The Android one ran the Kotlin unit
# tests next to a full assembleDebug, a second native compile of what ci.yml's
# mobile_native already builds for release; the unit tests moved into that job.
# A Linux job ran `swift test` in the swift:6.1-noble image, which the macOS job
# below repeats, and macOS is the Foundation the app actually ships on.

on:
  pull_request:
    paths:
      - 'apps/mobile/ios/**'
      - 'scripts/ios-typecheck.sh'
      - 'fixtures/mobile-contract/**'
      - '.github/workflows/native-mobile.yml'
  push:
    branches:
      - Main
      - main
    paths:
      - 'apps/mobile/ios/**'
      - 'scripts/ios-typecheck.sh'
      - 'fixtures/mobile-contract/**'
      - '.github/workflows/native-mobile.yml'

permissions:
  contents: read

jobs:
  ios:
    runs-on: macos-15
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Test TennisKit
        run: swift test --package-path apps/mobile/ios/TennisKit

      # There is no Xcode project in the repository yet, so there is nothing for
      # xcodebuild to open. This emits the TennisKit modules for the iOS and
      # watchOS simulator SDKs and typechecks the app and watch sources against
      # them; swap it for `xcodebuild test` once the project and its test targets
      # are committed.
      - name: Typecheck Swift sources
        run: ./scripts/ios-typecheck.sh
