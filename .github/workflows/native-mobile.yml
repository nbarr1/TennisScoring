name: Native mobile
on:
  pull_request:
    paths: ['apps/mobile/android/**', 'apps/mobile/ios/**', 'fixtures/mobile-contract/**']
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: pnpm/action-setup@v6
        with: { version: 9.15.5 }
      - uses: actions/setup-node@v6
        with:
          node-version-file: '.nvmrc'
          cache: pnpm
      - name: Install JavaScript dependencies
        run: pnpm install --frozen-lockfile
      - name: Build mobile workspace dependencies
        run: pnpm --filter @tennis/shared build && pnpm --filter @tennis/firebase-client build
      - name: Restore environment Firebase configuration
        run: echo "$GOOGLE_SERVICES_JSON" | base64 --decode > apps/mobile/android/app/google-services.json
        env: { GOOGLE_SERVICES_JSON: '${{ secrets.ANDROID_GOOGLE_SERVICES_JSON }}' }
      - run: apps/mobile/android/gradlew -p apps/mobile/android :app:testDebugUnitTest :app:assembleDebug
  ios:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Type-check checked-in Swift sources
        run: swiftc -typecheck apps/mobile/ios/TennisScoring/DomainModels.swift apps/mobile/ios/TennisScoring/ScoreEngine.swift apps/mobile/ios/TennisScoring/RankingEngine.swift
