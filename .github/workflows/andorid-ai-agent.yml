name: Android AI Agent

on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'Agent mode: review or apply'
        required: false
        default: 'review'

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  android-agent:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          pip install -r .github/scripts/requirements.txt

      - name: Determine Trigger Mode
        id: mode
        run: |
          if [ -n "${{ github.event.inputs.mode }}" ]; then
            echo "AGENT_MODE=${{ github.event.inputs.mode }}" >> $GITHUB_ENV
          else
            echo "AGENT_MODE=review" >> $GITHUB_ENV
          fi

      - name: Run Android AI Agent
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          AGENT_MODE: ${{ env.AGENT_MODE }}
        run: |
          python .github/scripts/android_agent.py
