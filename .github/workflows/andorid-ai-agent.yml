name: Android AI Agent

on:
  push:
    branches:
      - '**' # Triggers on push to any branch
  workflow_dispatch:
    inputs:
      mode:
        description: 'Agent Mode'
        required: true
        default: 'review'
        type: choice
        options:
          - review
          - apply

permissions:
  contents: write

jobs:
  android-agent:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 2 # Fetch previous commit to enable git diff comparison

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          pip install -r .github/scripts/requirements.txt

      - name: Determine Agent Mode
        run: |
          if [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
            echo "AGENT_MODE=${{ github.event.inputs.mode }}" >> $GITHUB_ENV
          else
            echo "AGENT_MODE=review" >> $GITHUB_ENV
          fi

      - name: Run Android AI Agent
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          AGENT_MODE: ${{ env.AGENT_MODE }}
        run: |
          python .github/scripts/android_agent.py

      - name: Commit and Push Changes (Apply Mode)
        if: ${{ env.AGENT_MODE == 'apply' }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -m "refactor(android-agent): Auto-apply AI code improvements" || echo "No changes to commit"
          git push origin ${{ github.ref_name }}
