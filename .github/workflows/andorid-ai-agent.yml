name: Android AI Agent

on:
  pull_request:
    types: [opened, synchronize]
  issue_comment:
    types: [created]
  workflow_dispatch:
    inputs:
      mode:
        description: 'Agent mode: review or apply'
        required: false
        default: 'review'
      pr_number:
        description: 'Pull request number (if running against a PR)'
        required: false

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  android-agent:
    if: |
      github.event_name == 'workflow_dispatch' ||
      github.event_name == 'pull_request' ||
      (github.event.issue.pull_request &&
       (contains(github.event.comment.body, '/apply-plan') || contains(github.event.comment.body, '/review-android')))
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          pip install -r .github/scripts/requirements.txt

      - name: Determine Trigger Mode
        id: mode
        run: |
          if [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
            # Use inputs from manual trigger if provided
            if [ -n "${{ github.event.inputs.mode }}" ]; then
              echo "AGENT_MODE=${{ github.event.inputs.mode }}" >> $GITHUB_ENV
            else
              echo "AGENT_MODE=review" >> $GITHUB_ENV
            fi

            if [ -n "${{ github.event.inputs.pr_number }}" ]; then
              echo "PR_NUM=${{ github.event.inputs.pr_number }}" >> $GITHUB_ENV
            else
              # leave empty or set to blank; downstream script should handle empty PR_NUM
              echo "PR_NUM=" >> $GITHUB_ENV
            fi

          elif [ "${{ github.event_name }}" == "pull_request" ]; then
            echo "AGENT_MODE=review" >> $GITHUB_ENV
            echo "PR_NUM=${{ github.event.pull_request.number }}" >> $GITHUB_ENV

          elif [[ "${{ github.event.comment.body }}" == *"/apply-plan"* ]]; then
            echo "AGENT_MODE=apply" >> $GITHUB_ENV
            echo "PR_NUM=${{ github.event.issue.number }}" >> $GITHUB_ENV

          else
            echo "AGENT_MODE=review" >> $GITHUB_ENV
            echo "PR_NUM=${{ github.event.issue.number }}" >> $GITHUB_ENV
          fi

      - name: Run Android AI Agent
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          PR_NUMBER: ${{ env.PR_NUM }}
          AGENT_MODE: ${{ env.AGENT_MODE }}
        run: |
          python .github/scripts/android_agent.py
