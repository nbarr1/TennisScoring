name: Android AI Agent

# Review-only. An earlier version also had an "apply" mode that pushed
# model-written file contents back to the branch with `contents: write`. It
# could never work (the plan it applied was only ever written to a previous
# run's workspace), and if it had, it would have written whatever paths and
# contents the model returned, from prompts built out of repository files.
on:
  push:
    paths:
      - 'apps/mobile/android/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android-agent:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 2 # Fetch previous commit to enable git diff comparison

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          pip install -r .github/scripts/requirements.txt

      # Writes its review to the job summary. Skips itself when GEMINI_API_KEY
      # is unavailable (forks and Dependabot pull requests).
      - name: Run Android AI Agent
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python .github/scripts/android_agent.py
