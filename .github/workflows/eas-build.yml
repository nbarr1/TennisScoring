name: EAS Build (Android APKs)

on:
  workflow_dispatch:
    inputs:
      target:
        description: Which Android APK to build
        required: true
        default: mobile
        type: choice
        options:
          - mobile
          - wear
          - wear-production
  pull_request:
    branches: [Main, main]
    paths:
      - 'apps/mobile/**'
      - 'packages/shared/**'
      - '.github/workflows/eas-build.yml'
  push:
    branches: [Main, main]
    paths:
      - 'apps/mobile/**'
      - 'packages/shared/**'
      - '.github/workflows/eas-build.yml'

permissions:
  contents: read

jobs:
  build:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.fork == false
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version-file: '.nvmrc'
      - uses: expo/expo-github-action@v8
        with:
          expo-version: latest
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}
      - run: npm install -g pnpm@9.15.5 && pnpm install
      - name: Select EAS profile
        id: profile
        run: |
          # The default branch is Main and this comparison is case-sensitive, so
          # refs/heads/main alone matched nothing: every push selected preview and
          # the production profile had never been built. Both spellings are named
          # here for the same reason every workflow's branch filter names both, so
          # a rename cannot silently disable it again.
          if [ "${{ github.event_name }}" = "push" ] &&
             { [ "${{ github.ref }}" = "refs/heads/Main" ] || [ "${{ github.ref }}" = "refs/heads/main" ]; }; then
            echo "name=production" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event.inputs.target }}" = "wear-production" ]; then
            echo "name=wear-production" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event.inputs.target }}" = "wear" ]; then
            echo "name=wear-preview" >> "$GITHUB_OUTPUT"
          else
            echo "name=preview" >> "$GITHUB_OUTPUT"
          fi
      # Release builds take their versionCode from this workflow's run number,
      # which only grows (:wear ships 1000000 + it). EAS's own autoIncrement
      # bumped this runner's copy of app.json and nothing committed it back, so
      # every production build reused one versionCode and Google Play rejects a
      # repeat upload. Remote app versioning cannot replace it: build.gradle
      # reads versionCode from app.json, so EAS can neither seed a remote
      # counter nor write one into the build. The edit is uncommitted, and the
      # upload includes it the way it included autoIncrement's.
      #
      # VERSION_CODE_OFFSET only ever goes up. Raise it if this workflow is
      # renamed or recreated (its run number restarts at 1), or if a build was
      # uploaded with a higher versionCode by hand; the script fails rather
      # than produce a versionCode Play has already seen.
      - name: Stamp release versionCode
        if: steps.profile.outputs.name == 'production' || steps.profile.outputs.name == 'wear-production'
        env:
          RUN_NUMBER: ${{ github.run_number }}
          VERSION_CODE_OFFSET: '0'
        run: node scripts/stamp-android-version-code.mjs apps/mobile/app.json
        # Run with --stacktrace option to get the stack trace.
        # Run with --info or --debug option to get more log output.
        # Run with --scan to get full insights.
      - working-directory: apps/mobile
        run: eas build --platform android --profile "${{ steps.profile.outputs.name }}" --non-interactive
        env:
          EXPO_PUBLIC_FIREBASE_API_KEY: ${{ secrets.NEXT_PUBLIC_FIREBASE_API_KEY }}
          EXPO_PUBLIC_FIREBASE_AUTH_DOMAIN: ${{ secrets.NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN }}
          EXPO_PUBLIC_FIREBASE_PROJECT_ID: ${{ secrets.NEXT_PUBLIC_FIREBASE_PROJECT_ID }}
          EXPO_PUBLIC_FIREBASE_STORAGE_BUCKET: ${{ secrets.NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET }}
          EXPO_PUBLIC_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID }}
          EXPO_PUBLIC_FIREBASE_APP_ID: ${{ secrets.NEXT_PUBLIC_FIREBASE_APP_ID }}
      - name: Build summary
        run: |
          {
            echo "## EAS Build Metadata"
            echo "- Commit: $GITHUB_SHA"
            echo "- Profile: ${{ steps.profile.outputs.name }}"
            echo "- Android versionCode: $(node -p "require('./apps/mobile/app.json').expo.android.versionCode")"
            echo "- Event: $GITHUB_EVENT_NAME"
            echo ""
            echo "## Debug Options"
            echo "- Run with \`--stacktrace\` option to get the stack trace."
            echo "- Run with \`--info\` or \`--debug\` option to get more log output."
            echo "- Run with \`--scan\` to get full insights."
          } >> "$GITHUB_STEP_SUMMARY"
