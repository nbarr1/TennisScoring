name: Deploy Firebase Functions (targeted)

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - "firebase/**"
      - "packages/shared/**"
      - ".github/workflows/deploy-firebase-function.yml"

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: firebase

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.5

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "pnpm"

      - name: Install deps (workspace root)
        run: pnpm install --frozen-lockfile
        working-directory: .

      - name: Build targeted functions bundle
        run: pnpm --filter @tennis/firebase-functions build:targeted-deploy
        working-directory: .

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
          project_id: ${{ secrets.FIREBASE_PROJECT_ID }}

      - name: Setup Google Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Verify feedback secret access
        run: >-
          gcloud secrets describe GITHUB_TOKEN
          --project "$FIREBASE_PROJECT_ID"
          --format='value(name)'
        working-directory: .
        env:
          FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}

      - name: Remove workspace-only dependency before deploy packaging
        run: |
          node -e "const fs=require('fs');const p='firebase/package.json';const d=JSON.parse(fs.readFileSync(p,'utf8'));if(d.devDependencies){delete d.devDependencies['@tennis/shared'];}fs.writeFileSync(p,JSON.stringify(d,null,2)+'\\n');"
        working-directory: .

      - name: Deploy updated functions
        run: >-
          npx firebase-tools deploy
          --only functions:addDivisionMemberPlaceholder,functions:mergeDivisionPlayerRecords,functions:updateDivisionPlayerEmail,functions:onMatchUpdate,functions:scoreMatchPoint,functions:recordMatchOnBehalf,functions:submitFeedback
          --project "$FIREBASE_PROJECT_ID"
        env:
          FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
