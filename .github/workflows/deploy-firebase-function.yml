name: Deploy Firebase Functions (targeted)

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - "firebase/**"
      - "packages/shared/**"
      - ".github/workflows/deploy-firebase-function.yml"

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: firebase

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.5

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "pnpm"

      - name: Install deps (workspace root)
        run: pnpm install --frozen-lockfile
        working-directory: .

      - name: Build shared + functions bundle
        run: pnpm --filter @tennis/firebase-functions build
        working-directory: .

      - name: Write service account credentials
        run: |
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT_JSON" > "$RUNNER_TEMP/gcp-sa.json"
        working-directory: .
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}

      - name: Remove workspace-only dependency before deploy packaging
        run: |
          node -e "const fs=require('fs');const p='firebase/package.json';const d=JSON.parse(fs.readFileSync(p,'utf8'));if(d.devDependencies){delete d.devDependencies['@tennis/shared'];}fs.writeFileSync(p,JSON.stringify(d,null,2)+'\\n');"
        working-directory: .

      - name: Deploy updated functions
        run: >-
          npx firebase-tools deploy
          --only functions:addDivisionMemberPlaceholder,functions:mergeDivisionPlayerRecords,functions:updateDivisionPlayerEmail,functions:onMatchUpdate,functions:scoreMatchPoint,functions:recordMatchOnBehalf
          --project "$FIREBASE_PROJECT_ID"
        env:
          FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/gcp-sa.json
