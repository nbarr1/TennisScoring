name: Deploy Firebase Functions (targeted)

# Deploys Cloud Functions to the Firebase project configured for the GitHub `staging`
# environment. There is no production job: promote by pointing the staging environment's
# FIREBASE_PROJECT_ID at the target project, or add a second job with its own environment once
# production credentials exist.
#
# A push deploys the targeted bundle (firebase/src/targetedDeployIndex.ts and the function list
# below). A dispatch with scope `full` builds firebase/src/fullDeployIndex.ts instead and deploys
# every function it exports, which adds generateMatchReport, health, and readiness. onUserCreated
# is left out of a full deploy unless include_on_user_created is ticked, which builds
# firebase/src/index.ts (fullDeployIndex.ts plus onUserCreated): it is an Identity Platform
# blocking function, so on a project without Identity Platform its deploy fails ("Blocking
# Functions may only be configured for GCIP projects"), and with Identity Platform on, a blank
# ALLOWED_EMAIL_DOMAIN makes it reject every sign-up.

on:
  workflow_dispatch:
    inputs:
      scope:
        description: "targeted: the functions listed in this workflow. full: every function exported by firebase/src/index.ts."
        type: choice
        options:
          - targeted
          - full
        default: targeted
      include_on_user_created:
        description: "Full scope only: also deploy the onUserCreated blocking function. Needs Identity Platform on the project and the ALLOWED_EMAIL_DOMAIN repository variable."
        type: boolean
        default: false
  push:
    # The repository's default branch, plus `main` so this keeps working if the default is
    # ever renamed. Naming only `main` meant the push trigger could never fire, because no
    # branch by that name exists here.
    branches:
      - Main
      - main
    paths:
      - "firebase/**"
      - "packages/shared/**"
      - ".github/workflows/deploy-firebase-function.yml"

# One group for every run, whatever its ref, because they all deploy to the same
# project: a dispatch from a branch must wait for a push deploy from Main, not
# interleave with it. Never cancel a run in progress. Cancelling a
# `firebase deploy` part-way can leave some functions on the new commit and
# others on the old one.
concurrency:
  group: deploy-firebase-functions
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy_staging:
    runs-on: ubuntu-latest
    environment: staging
    defaults:
      run:
        working-directory: firebase

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 9.15.5

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version-file: '.nvmrc'
          cache: "pnpm"

      - name: Install deps (workspace root)
        run: pnpm install --frozen-lockfile
        working-directory: .

      - name: Build functions bundle
        run: |
          set -euo pipefail
          # Every script writes lib/index.js, so the bundle deployed is whichever ran last.
          # firebase deploy resolves the params of every function in the bundle, not only the
          # ones named in --only, so a full deploy without onUserCreated builds an entry that
          # leaves it out. Otherwise the run stops on its unset ALLOWED_EMAIL_DOMAIN param.
          if [ "$SCOPE" = "full" ] && [ "$INCLUDE_ON_USER_CREATED" = "true" ]; then
            pnpm --filter @tennis/firebase-functions build
          elif [ "$SCOPE" = "full" ]; then
            pnpm --filter @tennis/firebase-functions build:full-deploy
          else
            pnpm --filter @tennis/firebase-functions build:targeted-deploy
          fi
        working-directory: .
        env:
          # A push has no inputs, so it deploys the targeted bundle.
          SCOPE: ${{ inputs.scope || 'targeted' }}
          INCLUDE_ON_USER_CREATED: ${{ inputs.include_on_user_created || false }}

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
          project_id: ${{ secrets.FIREBASE_PROJECT_ID }}

      - name: Setup Google Cloud SDK
        uses: google-github-actions/setup-gcloud@v3

      - name: Verify feedback GitHub configuration
        run: |
          set -euo pipefail

          : "${FIREBASE_PROJECT_ID:?FIREBASE_PROJECT_ID is required}"
          : "${GITHUB_OWNER:?GITHUB_OWNER could not be resolved}"
          : "${GITHUB_REPO:?GITHUB_REPO could not be resolved}"

          gcloud secrets describe GITHUB_TOKEN \
            --project "$FIREBASE_PROJECT_ID" \
            --format='value(name)' > /dev/null

          token="$(gcloud secrets versions access latest \
            --secret GITHUB_TOKEN \
            --project "$FIREBASE_PROJECT_ID")"

          response_file="$(mktemp)"
          status="$(curl --silent --show-error --location \
            --request POST \
            --output "$response_file" \
            --write-out '%{http_code}' \
            --header 'Accept: application/vnd.github+json' \
            --header "Authorization: Bearer $token" \
            --header 'Content-Type: application/json' \
            --header 'X-GitHub-Api-Version: 2022-11-28' \
            --data '{}' \
            "${GITHUB_API_URL%/}/repos/${GITHUB_OWNER}/${GITHUB_REPO}/issues")"

          if [ "$status" != "422" ]; then
            echo "GitHub token could not reach ${GITHUB_OWNER}/${GITHUB_REPO} issue creation validation (HTTP ${status})." >&2
            cat "$response_file" >&2
            exit 1
          fi

          echo "Verified GITHUB_TOKEN can authenticate to ${GITHUB_OWNER}/${GITHUB_REPO} issue creation endpoint without creating an issue."
        working-directory: .
        env:
          FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
          GITHUB_OWNER: ${{ vars.GITHUB_OWNER || github.repository_owner }}
          GITHUB_REPO: ${{ vars.GITHUB_REPO || github.event.repository.name }}
          GITHUB_API_URL: ${{ vars.GITHUB_API_URL || 'https://api.github.com' }}

      - name: Write Firebase params dotenv
        run: |
          set -euo pipefail

          node <<'NODE'
          const fs = require('fs');

          const required = [
            'FIREBASE_PROJECT_ID',
            'GITHUB_OWNER',
            'GITHUB_REPO',
            'GITHUB_API_URL',
            'GITHUB_FEEDBACK_LABELS',
          ];

          for (const name of required) {
            if (!process.env[name]) {
              throw new Error(`${name} could not be resolved`);
            }
          }

          // Match links in emails are built from APP_BASE_URL. Falling back to
          // localhost made recordMatchOnBehalf either throw after saving the
          // match or send players localhost links, so a missing value fails here.
          const appBaseUrl = (process.env.APP_BASE_URL || '').trim();
          if (!appBaseUrl.startsWith('https://')) {
            throw new Error('Set the APP_BASE_URL repository variable to the web app\'s https:// origin');
          }

          const escapeDotenvValue = (value) => JSON.stringify(value);
          const lines = [
            `APP_BASE_URL=${escapeDotenvValue(appBaseUrl)}`,
            `GITHUB_OWNER=${escapeDotenvValue(process.env.GITHUB_OWNER)}`,
            `GITHUB_REPO=${escapeDotenvValue(process.env.GITHUB_REPO)}`,
            `GITHUB_API_URL=${escapeDotenvValue(process.env.GITHUB_API_URL)}`,
            `GITHUB_FEEDBACK_LABELS=${escapeDotenvValue(process.env.GITHUB_FEEDBACK_LABELS)}`,
          ];

          // Read only by onUserCreated, which fails closed (rejects every sign-up) while it
          // is blank, so it is written only when the repository variable is set.
          const allowedEmailDomain = (process.env.ALLOWED_EMAIL_DOMAIN || '').trim();
          if (allowedEmailDomain) {
            lines.push(`ALLOWED_EMAIL_DOMAIN=${escapeDotenvValue(allowedEmailDomain)}`);
          }

          fs.writeFileSync(`.env.${process.env.FIREBASE_PROJECT_ID}`, `${lines.join('\n')}\n`);
          NODE
        env:
          FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
          GITHUB_OWNER: ${{ vars.GITHUB_OWNER || github.repository_owner }}
          GITHUB_REPO: ${{ vars.GITHUB_REPO || github.event.repository.name }}
          GITHUB_API_URL: ${{ vars.GITHUB_API_URL || 'https://api.github.com' }}
          GITHUB_FEEDBACK_LABELS: ${{ vars.GITHUB_FEEDBACK_LABELS || 'feedback' }}
          APP_BASE_URL: ${{ vars.APP_BASE_URL }}
          ALLOWED_EMAIL_DOMAIN: ${{ vars.ALLOWED_EMAIL_DOMAIN }}

      - name: Remove workspace-only dependency before deploy packaging
        run: |
          node -e "const fs=require('fs');const p='firebase/package.json';const d=JSON.parse(fs.readFileSync(p,'utf8'));if(d.devDependencies){delete d.devDependencies['@tennis/shared'];}fs.writeFileSync(p,JSON.stringify(d,null,2)+'\\n');"
        working-directory: .

      - name: Choose and verify the functions to deploy
        run: |
          set -euo pipefail

          # The targeted list. A function must be exported from src/targetedDeployIndex.ts and
          # named here, or a push deploy does not ship it.
          TARGETED='addDivisionMemberPlaceholder,mergeDivisionPlayerRecords,updateDivisionPlayerEmail,upsertDivisionLevel,upsertDivisionMembership,removeDivisionMembership,backfillDivisionSeasonLevel,backfillMissingProfiles,exportDivisionCsv,createDivision,joinDivisionByCode,onMatchUpdate,scoreMatchPoint,recordHistoricMatch,recordMatchOnBehalf,createDoublesMatch,sendInvite,getInvitePreview,acceptInvite,deleteAccount,publishRoundRobinSchedule,submitFeedback,addPlayerToDivisionByEmail,resolveDisputedReport,autoConfirmExpiredReports,requestMatchAppeal,decideMatchAppeal,recalculateDivisionRankings,repairAllDivisionRankings,onNewMessage,resolveMessageReport,sendMatchReminders,publishPlayoffBracket,cancelPlayoffBracket,onPlayoffMatchUpdate'

          SCOPE="$SCOPE" TARGETED="$TARGETED" INCLUDE_ON_USER_CREATED="$INCLUDE_ON_USER_CREATED" \
          ALLOWED_EMAIL_DOMAIN="$ALLOWED_EMAIL_DOMAIN" node <<'NODE'
          const fs = require('fs');
          const path = require('path');
          const mod = require(path.resolve(process.cwd(), 'lib/index.js'));
          const exported = Object.keys(mod).filter((name) => typeof mod[name] === 'function');

          let names;
          if (process.env.SCOPE === 'full') {
            const includeOnUserCreated = process.env.INCLUDE_ON_USER_CREATED === 'true';
            if (includeOnUserCreated && !(process.env.ALLOWED_EMAIL_DOMAIN || '').trim()) {
              console.error('::error::Set the ALLOWED_EMAIL_DOMAIN repository variable before deploying onUserCreated. While it is blank the function rejects every sign-up.');
              process.exit(1);
            }
            names = exported.filter((name) => includeOnUserCreated || name !== 'onUserCreated');
            const skipped = exported.filter((name) => !names.includes(name));
            if (skipped.length) console.log(`Not deploying: ${skipped.join(', ')}`);
          } else {
            names = process.env.TARGETED.split(',').map((v) => v.trim()).filter(Boolean);
            const missing = names.filter((name) => !exported.includes(name));
            if (missing.length) {
              console.error(`Missing targeted exports for deploy filters: ${missing.join(', ')}`);
              process.exit(1);
            }
          }

          if (!names.length) {
            console.error('No functions to deploy.');
            process.exit(1);
          }
          console.log(`Deploying ${names.length} functions: ${names.join(', ')}`);
          fs.appendFileSync(process.env.GITHUB_ENV, `DEPLOY_FUNCTIONS=${names.join(',')}\n`);
          fs.appendFileSync(
            process.env.GITHUB_STEP_SUMMARY,
            `Scope: \`${process.env.SCOPE}\`, ${names.length} functions\n\n${names.map((n) => `- \`${n}\``).join('\n')}\n`,
          );
          NODE
        env:
          SCOPE: ${{ inputs.scope || 'targeted' }}
          INCLUDE_ON_USER_CREATED: ${{ inputs.include_on_user_created || false }}
          ALLOWED_EMAIL_DOMAIN: ${{ vars.ALLOWED_EMAIL_DOMAIN }}

      - name: Deploy functions (staging)
        run: |
          set -euo pipefail

          : "${DEPLOY_FUNCTIONS:?DEPLOY_FUNCTIONS was not set by the previous step}"
          npx firebase-tools deploy \
            --only "functions:${DEPLOY_FUNCTIONS//,/\,functions:}" \
            --project "$FIREBASE_PROJECT_ID"
        env:
          FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
          GITHUB_OWNER: ${{ vars.GITHUB_OWNER || github.repository_owner }}
          GITHUB_REPO: ${{ vars.GITHUB_REPO || github.event.repository.name }}
          GITHUB_API_URL: ${{ vars.GITHUB_API_URL || 'https://api.github.com' }}
          GITHUB_FEEDBACK_LABELS: ${{ vars.GITHUB_FEEDBACK_LABELS || 'feedback' }}
          APP_BASE_URL: ${{ vars.APP_BASE_URL }}
