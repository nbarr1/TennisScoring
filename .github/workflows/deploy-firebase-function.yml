name: Deploy Firebase Functions (targeted)

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - "firebase/**"
      - "packages/shared/**"
      - ".github/workflows/deploy-firebase-function.yml"

concurrency:
  group: deploy-firebase-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  deploy_staging:
    runs-on: ubuntu-latest
    environment: staging
    defaults:
      run:
        working-directory: firebase

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 9.15.5

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: "pnpm"

      - name: Install deps (workspace root)
        run: pnpm install --frozen-lockfile
        working-directory: .

      - name: Build targeted functions bundle
        run: pnpm --filter @tennis/firebase-functions build:targeted-deploy
        working-directory: .

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
          project_id: ${{ secrets.FIREBASE_PROJECT_ID }}

      - name: Setup Google Cloud SDK
        uses: google-github-actions/setup-gcloud@v3

      - name: Verify feedback GitHub configuration
        run: |
          set -euo pipefail

          : "${FIREBASE_PROJECT_ID:?FIREBASE_PROJECT_ID is required}"
          : "${GITHUB_OWNER:?GITHUB_OWNER could not be resolved}"
          : "${GITHUB_REPO:?GITHUB_REPO could not be resolved}"

          gcloud secrets describe GITHUB_TOKEN \
            --project "$FIREBASE_PROJECT_ID" \
            --format='value(name)' > /dev/null

          token="$(gcloud secrets versions access latest \
            --secret GITHUB_TOKEN \
            --project "$FIREBASE_PROJECT_ID")"

          response_file="$(mktemp)"
          status="$(curl --silent --show-error --location \
            --request POST \
            --output "$response_file" \
            --write-out '%{http_code}' \
            --header 'Accept: application/vnd.github+json' \
            --header "Authorization: Bearer $token" \
            --header 'Content-Type: application/json' \
            --header 'X-GitHub-Api-Version: 2022-11-28' \
            --data '{}' \
            "${GITHUB_API_URL%/}/repos/${GITHUB_OWNER}/${GITHUB_REPO}/issues")"

          if [ "$status" != "422" ]; then
            echo "GitHub token could not reach ${GITHUB_OWNER}/${GITHUB_REPO} issue creation validation (HTTP ${status})." >&2
            cat "$response_file" >&2
            exit 1
          fi

          echo "Verified GITHUB_TOKEN can authenticate to ${GITHUB_OWNER}/${GITHUB_REPO} issue creation endpoint without creating an issue."
        working-directory: .
        env:
          FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
          GITHUB_OWNER: ${{ vars.GITHUB_OWNER || github.repository_owner }}
          GITHUB_REPO: ${{ vars.GITHUB_REPO || github.event.repository.name }}
          GITHUB_API_URL: ${{ vars.GITHUB_API_URL || 'https://api.github.com' }}

      - name: Write Firebase params dotenv
        run: |
          set -euo pipefail

          node <<'NODE'
          const fs = require('fs');

          const required = [
            'FIREBASE_PROJECT_ID',
            'GITHUB_OWNER',
            'GITHUB_REPO',
            'GITHUB_API_URL',
            'GITHUB_FEEDBACK_LABELS',
          ];

          for (const name of required) {
            if (!process.env[name]) {
              throw new Error(`${name} could not be resolved`);
            }
          }

          const escapeDotenvValue = (value) => JSON.stringify(value);
          const appBaseUrl = process.env.APP_BASE_URL || 'http://localhost:3000';
          const lines = [
            `APP_BASE_URL=${escapeDotenvValue(appBaseUrl)}`,
            `GITHUB_OWNER=${escapeDotenvValue(process.env.GITHUB_OWNER)}`,
            `GITHUB_REPO=${escapeDotenvValue(process.env.GITHUB_REPO)}`,
            `GITHUB_API_URL=${escapeDotenvValue(process.env.GITHUB_API_URL)}`,
            `GITHUB_FEEDBACK_LABELS=${escapeDotenvValue(process.env.GITHUB_FEEDBACK_LABELS)}`,
          ];

          fs.writeFileSync(`.env.${process.env.FIREBASE_PROJECT_ID}`, `${lines.join('\n')}\n`);
          NODE
        env:
          FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
          GITHUB_OWNER: ${{ vars.GITHUB_OWNER || github.repository_owner }}
          GITHUB_REPO: ${{ vars.GITHUB_REPO || github.event.repository.name }}
          GITHUB_API_URL: ${{ vars.GITHUB_API_URL || 'https://api.github.com' }}
          GITHUB_FEEDBACK_LABELS: ${{ vars.GITHUB_FEEDBACK_LABELS || 'feedback' }}
          APP_BASE_URL: ${{ vars.APP_BASE_URL || 'http://localhost:3000' }}

      - name: Remove workspace-only dependency before deploy packaging
        run: |
          node -e "const fs=require('fs');const p='firebase/package.json';const d=JSON.parse(fs.readFileSync(p,'utf8'));if(d.devDependencies){delete d.devDependencies['@tennis/shared'];}fs.writeFileSync(p,JSON.stringify(d,null,2)+'\\n');"
        working-directory: .

      - name: Verify deploy filters exist in targeted bundle
        run: |
          set -euo pipefail

          FILTERS='addDivisionMemberPlaceholder,mergeDivisionPlayerRecords,updateDivisionPlayerEmail,upsertDivisionLevel,upsertDivisionMembership,backfillDivisionSeasonLevel,exportDivisionCsv,createDivision,joinDivisionByCode,onMatchUpdate,scoreMatchPoint,recordHistoricMatch,recordMatchOnBehalf,sendInvite,getInvitePreview,acceptInvite,submitFeedback'

          FILTERS="$FILTERS" node <<'NODE'
          const path = require('path');
          const filters = (process.env.FILTERS || '').split(',').map((v) => v.trim()).filter(Boolean);
          const mod = require(path.resolve(process.cwd(), 'lib/index.js'));
          const missing = filters.filter((name) => typeof mod[name] !== 'function');
          if (missing.length) {
            console.error(`Missing targeted exports for deploy filters: ${missing.join(', ')}`);
            process.exit(1);
          }
          console.log(`Verified ${filters.length} deploy filters are exported by lib/index.js`);
          NODE

      - name: Deploy updated functions (staging)
        run: |
          set -euo pipefail

          DEPLOY_FUNCTIONS='addDivisionMemberPlaceholder,mergeDivisionPlayerRecords,updateDivisionPlayerEmail,upsertDivisionLevel,upsertDivisionMembership,backfillDivisionSeasonLevel,exportDivisionCsv,createDivision,joinDivisionByCode,onMatchUpdate,scoreMatchPoint,recordHistoricMatch,recordMatchOnBehalf,sendInvite,getInvitePreview,acceptInvite,submitFeedback'

          npx firebase-tools deploy \
            --only "functions:${DEPLOY_FUNCTIONS//,/\,functions:}" \
            --project "$FIREBASE_PROJECT_ID"
        env:
          FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
          GITHUB_OWNER: ${{ vars.GITHUB_OWNER || github.repository_owner }}
          GITHUB_REPO: ${{ vars.GITHUB_REPO || github.event.repository.name }}
          GITHUB_API_URL: ${{ vars.GITHUB_API_URL || 'https://api.github.com' }}
          GITHUB_FEEDBACK_LABELS: ${{ vars.GITHUB_FEEDBACK_LABELS || 'feedback' }}
          APP_BASE_URL: ${{ vars.APP_BASE_URL || 'http://localhost:3000' }}

  deploy_production:
    if: github.event_name == 'workflow_dispatch'
    needs: deploy_staging
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Manual promotion gate
        run: echo 'Approve this environment to promote deployment to production.'
