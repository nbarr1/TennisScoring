name: CI

on:
  push:
    branches: [main, 'claude/**']
  pull_request:
    branches: [main, 'claude/**']

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      shared_or_root: ${{ steps.filter.outputs.shared_or_root }}
      firebase: ${{ steps.filter.outputs.firebase }}
      mobile: ${{ steps.filter.outputs.mobile }}
    steps:
      - uses: actions/checkout@v6
      - id: filter
        uses: dorny/paths-filter@v4
        with:
          filters: |
            # Every filter includes this workflow itself. A PR that edits only
            # ci.yml would otherwise run nothing but lint_typecheck, so a change
            # to a filtered job's own steps lands with that job skipped — which
            # is how the osv-scanner action bump in PR #287 reached review with
            # firebase_rules_tests, the job containing the edited step, skipped.
            shared_or_root:
              - 'packages/shared/**'
              - 'package.json'
              - 'pnpm-lock.yaml'
              - 'pnpm-workspace.yaml'
              - 'tsconfig.base.json'
              - '.github/workflows/ci.yml'
            firebase:
              - 'firebase/**'
              - 'packages/shared/**'
              - '.github/workflows/ci.yml'
            mobile:
              - 'apps/mobile/**'
              - 'packages/**'
              - 'package.json'
              - 'pnpm-lock.yaml'
              - 'pnpm-workspace.yaml'
              - '.github/workflows/ci.yml'

  lint_typecheck:
    needs: changes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
        with:
          version: 9.15.5
      - uses: actions/setup-node@v6
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Type check
        run: pnpm typecheck
      - name: Lint
        run: pnpm lint
      # Runs last because it is the most expensive step, so the cheap checks fail
      # fast. Nothing here compiled the apps before, which is how a `require` of a
      # module path that no longer exists in the installed Firebase SDK reached the
      # default branch: typecheck missed it behind an `as any`, and only a real
      # bundler resolves it. Turbo caches the upstream packages that typecheck
      # already built, so this mostly costs the Next.js compile.
      - name: Build
        run: pnpm build

  shared_tests:
    needs: changes
    if: needs.changes.outputs.shared_or_root == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
        with:
          version: 9.15.5
      - uses: actions/setup-node@v6
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Test (shared package)
        run: pnpm --filter @tennis/shared test

  firebase_rules_tests:
    needs: changes
    if: needs.changes.outputs.firebase == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
        with:
          version: 9.15.5
      - uses: actions/setup-node@v6
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      # The Firestore and Storage emulators run on the JVM, and firebase-tools 15
      # refuses to start on a JDK older than 21. The runner's preinstalled JDK is
      # older, so without this the emulator exits before the smoke test runs.
      - name: Set up Java for the Firebase emulators
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      # The rules checks run before the dependency audit. The audit gates this job,
      # so while it fails these steps never execute and rules changes land with no
      # CI signal at all — which is how the job behaved from June 2026 onward.
      - name: Firebase rules guard
        run: pnpm check:firebase-rules
      - name: Firebase emulator rules smoke test
        run: pnpm --filter @tennis/firebase-functions test:rules
      # Reproduces the intended `pnpm audit || osv-scanner` fallback, where the
      # scanner casts the deciding vote. osv-scanner is a Go binary published as a
      # container action, not an npm package, so the previous `npx --yes osv-scanner`
      # invocation always 404'd — leaving any advisory as an unconditional job
      # failure with a misleading error. continue-on-error below only defers the
      # verdict to the scanner step; it does not make the audit non-blocking.
      - name: Dependency audit
        id: pnpm_audit
        continue-on-error: true
        run: pnpm audit --audit-level=high
      - name: Dependency audit fallback (OSV)
        if: steps.pnpm_audit.outcome == 'failure'
        uses: google/osv-scanner-action/osv-scanner-action@v2.5.1
        with:
          scan-args: |-
            --lockfile=pnpm-lock.yaml

  # Nothing else compiles the mobile app: lint_typecheck only runs tsc and eslint
  # over it, and `pnpm build` has no mobile target. That gap let an Expo 57 upgrade
  # land a release-breaking regression on the default branch — Metro emitted ES
  # private class fields that hermes-compiler 0.14.0 (the version react-native
  # 0.83.1 pins, and the one Gradle invokes with hermesEnabled=true) cannot parse,
  # so every EAS Android build would have failed at the bytecode step. Bundling
  # alone would not have caught it; the bytecode compile is the part that fails.
  mobile_bundle:
    needs: changes
    if: needs.changes.outputs.mobile == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
        with:
          version: 9.15.5
      - uses: actions/setup-node@v6
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      # The app imports both workspace packages by their built dist output.
      - name: Build workspace dependencies
        run: pnpm --filter @tennis/shared build && pnpm --filter @tennis/firebase-client build
      # Gradle runs codegen for every autolinked native module before it ever
      # bundles JavaScript, and it enforces rules Metro never sees. Bundling
      # alone missed react-native-screens 4.27.0, whose command specs use
      # React.ComponentRef<> where react-native 0.83.1's parser requires
      # React.ElementRef<> — it bundled cleanly and failed the EAS build at
      # generateCodegenSchemaFromJavaScript. Run codegen first: it is seconds,
      # and it fails on exactly what the native build would reject.
      - name: Codegen (autolinked native modules)
        run: pnpm check:mobile-codegen
      # app.config.js hard-fails when CI=true and these are unset. They are
      # deliberately placeholders, not secrets: this check only needs the module
      # graph to resolve and compile, and real values would make the job unusable
      # on fork and Dependabot pull requests, which cannot read repository secrets.
      - name: Bundle for release (Metro)
        working-directory: apps/mobile
        env:
          EXPO_PUBLIC_FIREBASE_API_KEY: ci-placeholder
          EXPO_PUBLIC_FIREBASE_AUTH_DOMAIN: ci-placeholder
          EXPO_PUBLIC_FIREBASE_PROJECT_ID: ci-placeholder
          EXPO_PUBLIC_FIREBASE_STORAGE_BUCKET: ci-placeholder
          EXPO_PUBLIC_FIREBASE_MESSAGING_SENDER_ID: ci-placeholder
          EXPO_PUBLIC_FIREBASE_APP_ID: ci-placeholder
        run: |
          mkdir -p "$RUNNER_TEMP/mobile-bundle/assets"
          npx expo export:embed \
            --platform android \
            --dev false \
            --bundle-output "$RUNNER_TEMP/mobile-bundle/index.android.bundle" \
            --assets-dest "$RUNNER_TEMP/mobile-bundle/assets"
      # Compiles with the exact hermesc the Android Gradle build uses, so a syntax
      # feature the pinned Hermes cannot handle fails here instead of in EAS.
      - name: Compile bundle to Hermes bytecode
        run: |
          node_modules/hermes-compiler/hermesc/linux64-bin/hermesc \
            -emit-binary \
            -out "$RUNNER_TEMP/mobile-bundle/index.android.hbc" \
            "$RUNNER_TEMP/mobile-bundle/index.android.bundle" \
            -O
          ls -la "$RUNNER_TEMP/mobile-bundle/index.android.hbc"

  # mobile_bundle stops at JavaScript: it bundles and compiles to Hermes bytecode,
  # but never compiles a line of C++. That left the native half of an EAS build
  # completely unverified, and it is where the Expo 57 upgrade actually broke.
  # react-native was left on 0.83.1 while expo moved to SDK 57 (which wants
  # 0.86.2), so expo-modules-core's NativeArrayBuffer.cpp called
  # jsi::ArrayBuffer::tryGetMutableBuffer — an API that does not exist before
  # react-native 0.86. Codegen passed, Metro bundled, Hermes compiled, and the
  # build still died at :expo-modules-core:buildCMakeRelWithDebInfo after eight
  # minutes of EAS time. This job runs that same CMake compile on a pull request.
  #
  # Restricted to one ABI: the failures this catches are C++ API and codegen
  # mismatches, which are identical across architectures, so a second ABI would
  # double the runtime and find nothing new. Release stays unsigned — signing is
  # EAS/Play's job, and this build exists to prove the code compiles, not to
  # produce anything installable.
  mobile_native:
    needs: changes
    if: needs.changes.outputs.mobile == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
        with:
          version: 9.15.5
      - uses: actions/setup-node@v6
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'
      # settings.gradle resolves the react-native and expo Gradle plugins through
      # `node --print require.resolve(...)`, so node_modules has to exist before
      # Gradle can configure anything.
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build workspace dependencies
        run: pnpm --filter @tennis/shared build && pnpm --filter @tennis/firebase-client build
      # Android Gradle Plugin 8.12, pinned by react-native 0.86.2's version
      # catalog, requires JDK 17 or newer.
      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
      # react-native 0.86.2 pins this exact NDK in gradle/libs.versions.toml, and
      # AGP fails rather than substituting whichever NDK the runner image ships.
      - name: Install Android NDK
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null 2>&1 || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "ndk;27.1.12297006" > /dev/null
      # Gradle bundles the JavaScript itself as part of assembleRelease, so it
      # needs the same placeholders mobile_bundle uses — app.config.js hard-fails
      # when CI=true and they are unset. They are deliberately not secrets, so this
      # job still runs on fork and Dependabot pull requests.
      - name: Assemble release (native compile)
        working-directory: apps/mobile/android
        env:
          EXPO_PUBLIC_FIREBASE_API_KEY: ci-placeholder
          EXPO_PUBLIC_FIREBASE_AUTH_DOMAIN: ci-placeholder
          EXPO_PUBLIC_FIREBASE_PROJECT_ID: ci-placeholder
          EXPO_PUBLIC_FIREBASE_STORAGE_BUCKET: ci-placeholder
          EXPO_PUBLIC_FIREBASE_MESSAGING_SENDER_ID: ci-placeholder
          EXPO_PUBLIC_FIREBASE_APP_ID: ci-placeholder
        run: |
          ./gradlew :app:assembleRelease \
            -PreactNativeArchitectures=arm64-v8a \
            --no-daemon \
            --stacktrace
      - name: Report built artifacts
        if: always()
        run: find apps/mobile/android/app/build/outputs -name '*.apk' -exec ls -la {} + || true
