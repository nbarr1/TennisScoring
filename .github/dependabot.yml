version: 2
updates:
  - package-ecosystem: npm
    directory: '/'
    schedule:
      interval: weekly
    ignore:
      # react-native is constrained by the Expo SDK version; do not auto-bump
      - dependency-name: react-native
        update-types: ['version-update:semver-minor', 'version-update:semver-patch']
      # TypeScript 7 is the native (tsgo) port and no longer exposes the
      # JavaScript compiler API that tsup --dts (rollup-plugin-dts), ts-jest,
      # and typescript-eslint all depend on. Majors must be adopted manually.
      - dependency-name: typescript
        update-types: ['version-update:semver-major']
    groups:
      monorepo-npm:
        patterns:
          - '*'
        exclude-patterns:
          - 'react-native'

  - package-ecosystem: github-actions
    directory: '/'
    schedule:
      interval: weekly
