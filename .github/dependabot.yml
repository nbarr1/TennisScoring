version: 2
updates:
  - package-ecosystem: npm
    directory: '/'
    schedule:
      interval: weekly
    ignore:
      # react-native is constrained by the Expo SDK version; do not auto-bump it
      # on its own. It must still be moved *with* every Expo SDK upgrade to the
      # version in expo/bundledNativeModules.json — leaving it behind is what
      # stranded the app on 0.83.1 under SDK 57 (which wants 0.86.2) and broke
      # the Android native build. Check that file when bumping expo.
      - dependency-name: react-native
        update-types: ['version-update:semver-minor', 'version-update:semver-patch']
      # TypeScript 7 is the native (tsgo) port and no longer exposes the
      # JavaScript compiler API that tsup --dts (rollup-plugin-dts), ts-jest,
      # and typescript-eslint all depend on. Majors must be adopted manually.
      - dependency-name: typescript
        update-types: ['version-update:semver-major']
      # react-native-reanimated's version is dictated by what expo-modules-core
      # accepts as a react-native-worklets peer, not by what reanimated publishes.
      # 4.6.0 requires worklets 0.12.x while expo-modules-core 57 accepts
      # ^0.7.4 || ^0.8.0 || ^0.9.0 || ^0.10.0 — disjoint ranges, so pnpm installs
      # no worklets at all and Metro cannot resolve it. Stable worklets 0.12.x
      # now exists, but expo-modules-core still does not accept it, so the ranges
      # remain disjoint. Bump this alongside an Expo SDK upgrade, not on its own.
      - dependency-name: react-native-reanimated
        update-types:
          ['version-update:semver-major', 'version-update:semver-minor']
      # The Expo 57 / React Native 0.86 Babel toolchain is Babel 7 throughout.
      # babel-preset-expo pulls in @babel/preset-typescript, which calls
      # assertVersion("^7.0.0-0"), so @babel/core 8 fails the Metro transform
      # outright ("Requires Babel ^7.0.0-0, but was loaded with 8.0.1").
      # The pnpm override pins ^7.29.6; a major bump defeats it rather than
      # being blocked by it, so keep majors out of the auto-bump entirely.
      - dependency-name: '@babel/core'
        update-types: ['version-update:semver-major']
    groups:
      # The Expo SDK constrains this whole set: react-native is pinned to an
      # exact version by expo, reanimated is bounded by the react-native-worklets
      # peer expo-modules-core accepts, and the Babel packages must stay on 7
      # because babel-preset-expo's plugins assert it. They move together, with
      # an SDK upgrade — so group them rather than letting one of them sit in the
      # general group and hold back unrelated updates, which is what happened
      # when a single reanimated bump blocked nineteen other packages.
      expo-toolchain:
        patterns:
          - 'expo'
          - 'expo-*'
          - '@expo/*'
          - 'react-native'
          - 'react-native-*'
          - '@react-native/*'
          - '@react-native-*/*'
          - '@react-navigation/*'
          - 'metro'
          - 'metro-*'
          - 'babel-preset-expo'
          - '@babel/*'
      monorepo-npm:
        patterns:
          - '*'
        exclude-patterns:
          - 'expo'
          - 'expo-*'
          - '@expo/*'
          - 'react-native'
          - 'react-native-*'
          - '@react-native/*'
          - '@react-native-*/*'
          - '@react-navigation/*'
          - 'metro'
          - 'metro-*'
          - 'babel-preset-expo'
          - '@babel/*'

  - package-ecosystem: github-actions
    directory: '/'
    schedule:
      interval: weekly
