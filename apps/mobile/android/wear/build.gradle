plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.tennisleague.watch'
    compileSdk rootProject.ext.compileSdkVersion

    defaultConfig {
        // Wear OS Data Layer delivers messages between apps that share the same package name.
        // Keep this aligned with :app so the Galaxy Watch can talk to the phone app.
        applicationId 'com.companytennisleague.app'
        minSdk 26
        targetSdk rootProject.ext.targetSdkVersion
        // Versioned in lockstep with :app from app.json, via rootProject.ext
        // (see android/build.gradle). These were pinned at 1.0.0/1 by hand and
        // had drifted four releases behind the phone app.
        //
        // NOTE: :app and :wear deliberately share an applicationId (above), so if
        // this APK is ever published to the same Play listing as the phone app it
        // will need a versionCode distinct from :app's. That does not apply today:
        // release here is debug-signed for internal distribution only, which Play
        // does not accept.
        versionCode rootProject.ext.appVersionCode
        versionName rootProject.ext.appVersionName
    }


    signingConfigs {
        debug {
            storeFile file('../app/debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
    }

    buildTypes {
        release {
            // Ensure the Wear APK produced by :wear:assembleRelease is signed and installable for internal distribution.
            signingConfig signingConfigs.debug
        }
    }
}

dependencies {
    implementation 'com.google.android.gms:play-services-wearable:18.2.0'
}
