plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.tennisleague.watch'
    compileSdk 35

    defaultConfig {
        // Wear OS Data Layer delivers messages between apps that share the same package name.
        // Keep this aligned with :app so the Galaxy Watch can talk to the phone app.
        applicationId 'com.companytennisleague.app'
        minSdk 26
        targetSdk 35
        // Versioned in lockstep with :app from app.json, via rootProject.ext
        // (see android/build.gradle). These were pinned at 1.0.0/1 by hand and
        // had drifted four releases behind the phone app.
        //
        // Reserve a separate range for Wear artifacts. Because the two modules
        // share a Play listing, reusing the phone's code makes the second upload fail.
        versionCode 1000000 + rootProject.ext.appVersionCode
        versionName rootProject.ext.appVersionName
    }


    // EAS signs release builds by writing eas-build-inject-android-credentials.gradle
    // into android/app and applying it from app/build.gradle only, so it never
    // reaches this module: a wear-production bundle came out unsigned and Play
    // refused it. Read the same credentials.json that script reads (EAS writes it
    // to EAS_BUILD_WORKINGDIR for every build that has remote credentials). Both
    // modules share an applicationId, so this is the phone's keystore, which is
    // what Play requires of two artifacts in one listing.
    def easWorkingDir = System.getenv('EAS_BUILD_WORKINGDIR')
    def easCredentialsFile = easWorkingDir ? new File(easWorkingDir, 'credentials.json') : null
    def easKeystore = (easCredentialsFile != null && easCredentialsFile.isFile()) ?
        new groovy.json.JsonSlurper().parse(easCredentialsFile)?.android?.keystore : null

    signingConfigs {
        debug {
            storeFile file('../app/debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
        if (easKeystore != null) {
            release {
                def keystoreFile = new File(easKeystore.keystorePath as String)
                storeFile keystoreFile.isAbsolute() ? keystoreFile : new File(easWorkingDir, easKeystore.keystorePath as String)
                storePassword easKeystore.keystorePassword
                keyAlias easKeystore.keyAlias
                // PKCS12 keystores have no separate key password; EAS's own script
                // falls back to the keystore password the same way.
                keyPassword easKeystore.containsKey('keyPassword') ? easKeystore.keyPassword : easKeystore.keystorePassword
            }
        }
    }

    buildTypes {
        release {
            // Mirrors :app/build.gradle: debug-sign only for internal-distribution
            // profiles (wear-preview). Otherwise sign with the EAS keystore when the
            // build has one (wear-production). A local release build has neither and
            // stays unsigned — Play rejects debug-signed and unsigned bundles alike.
            def allowDebugReleaseSigning = ((findProperty('android.allowDebugReleaseSigning') ?: 'false').toBoolean()) ||
                ((System.getenv('EAS_BUILD_PROFILE') ?: '').toLowerCase() in ['preview', 'wear-preview'])
            if (allowDebugReleaseSigning) {
                signingConfig signingConfigs.debug
            } else if (easKeystore != null) {
                signingConfig signingConfigs.release
            }
        }
    }
}

dependencies {
    implementation 'com.google.android.gms:play-services-wearable:18.2.0'
    // AmbientLifecycleObserver (added in 1.3.0), so a live scoreboard dims to a
    // low-power ambient view instead of holding the display at full brightness.
    // Its public API exposes androidx.fragment, which brings androidx.activity's
    // ComponentActivity, the lifecycle owner the observer attaches to. 1.4.0 has
    // the same ambient API; 1.3.0 keeps the transitive androidx versions old
    // enough for compileSdk 35.
    implementation 'androidx.wear:wear:1.3.0'
}
