plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.tennisleague.watch'
    compileSdk 35

    defaultConfig {
        // Wear OS Data Layer delivers messages between apps that share the same package name.
        // Keep this aligned with :app so the Galaxy Watch can talk to the phone app.
        applicationId 'com.companytennisleague.app'
        minSdk 26
        targetSdk 35
        // Versioned in lockstep with :app from app.json, via rootProject.ext
        // (see android/build.gradle). These were pinned at 1.0.0/1 by hand and
        // had drifted four releases behind the phone app.
        //
        // Reserve a separate range for Wear artifacts. Because the two modules
        // share a Play listing, reusing the phone's code makes the second upload fail.
        versionCode 1000000 + rootProject.ext.appVersionCode
        versionName rootProject.ext.appVersionName
    }


    signingConfigs {
        debug {
            storeFile file('../app/debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
    }

    buildTypes {
        release {
            // Mirrors :app/build.gradle: debug-sign only for internal-distribution
            // profiles (wear-preview). A real Play submission (wear-production)
            // leaves signingConfig unset so EAS-managed release signing
            // (`eas credentials`) is applied instead — Play rejects debug-signed
            // release builds.
            def allowDebugReleaseSigning = ((findProperty('android.allowDebugReleaseSigning') ?: 'false').toBoolean()) ||
                ((System.getenv('EAS_BUILD_PROFILE') ?: '').toLowerCase() in ['preview', 'wear-preview'])
            if (allowDebugReleaseSigning) {
                signingConfig signingConfigs.debug
            }
        }
    }
}

dependencies {
    implementation 'com.google.android.gms:play-services-wearable:18.2.0'
    // AmbientLifecycleObserver (added in 1.3.0), so a live scoreboard dims to a
    // low-power ambient view instead of holding the display at full brightness.
    // Its public API exposes androidx.fragment, which brings androidx.activity's
    // ComponentActivity, the lifecycle owner the observer attaches to. 1.4.0 has
    // the same ambient API; 1.3.0 keeps the transitive androidx versions old
    // enough for compileSdk 35.
    implementation 'androidx.wear:wear:1.3.0'
}
