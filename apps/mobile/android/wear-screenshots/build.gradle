// Renders the Wear OS app's real screens to PNGs for the Play listing.
//
// This compiles the watch module's own sources, resources, and manifest
// (../wear/src/main) and runs StoreScreenshots under Robolectric's native
// graphics, which draws the actual MainActivity view tree with Skia. The test
// feeds the activity the same v1 snapshot envelope the phone sends, so the
// screens are the code's own output, not mockups. Run it with:
//
//   gradle -p apps/mobile/android/wear-screenshots testDebugUnitTest
//
// The PNGs land in build/shots. .github/workflows/wear-screenshots.yml runs it
// in CI and uploads them.
plugins {
  id 'com.android.application' version '8.12.0'
  id 'org.jetbrains.kotlin.android' version '2.1.20'
}

def wearMain = file('../wear/src/main')

android {
  namespace 'com.tennisleague.watch'
  compileSdk 35

  defaultConfig {
    applicationId 'com.companytennisleague.app'
    minSdk 26
    targetSdk 35
  }

  sourceSets {
    main {
      manifest.srcFile new File(wearMain, 'AndroidManifest.xml')
      java.srcDirs = [new File(wearMain, 'java')]
      res.srcDirs = [new File(wearMain, 'res')]
    }
  }

  compileOptions {
    sourceCompatibility JavaVersion.VERSION_17
    targetCompatibility JavaVersion.VERSION_17
  }
  kotlinOptions { jvmTarget = '17' }

  testOptions {
    unitTests {
      includeAndroidResources = true
      all {
        maxHeapSize = '3g'
        systemProperty 'shots.out', layout.buildDirectory.dir('shots').get().asFile.absolutePath
        testLogging { events 'passed', 'failed'; showStandardStreams = true; exceptionFormat 'full' }
      }
    }
  }
}

dependencies {
  // Keep in step with ../wear/build.gradle.
  implementation 'com.google.android.gms:play-services-wearable:18.2.0'
  implementation 'androidx.wear:wear:1.3.0'

  testImplementation 'junit:junit:4.13.2'
  testImplementation 'org.robolectric:robolectric:4.17'
  testImplementation 'androidx.test:core:1.6.1'
}
