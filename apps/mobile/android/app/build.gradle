plugins {
  id 'com.android.application'
  id 'org.jetbrains.kotlin.android'
  id 'org.jetbrains.kotlin.plugin.compose'
  id 'com.google.gms.google-services'
}

android {
  namespace 'com.companytennisleague.app'
  compileSdk 35
  defaultConfig {
    applicationId 'com.companytennisleague.app'
    minSdk 26
    targetSdk 35
    versionCode 6
    versionName '1.1.0'
    testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
  }
  signingConfigs { debug { storeFile file('debug.keystore'); storePassword 'android'; keyAlias 'androiddebugkey'; keyPassword 'android' } }
  buildTypes {
    debug { signingConfig signingConfigs.debug }
    release {
      // Production signing remains injected by the established Play credential workflow.
      minifyEnabled true
      shrinkResources true
      proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
    }
  }
  buildFeatures { compose true; buildConfig true }
  kotlinOptions { jvmTarget = '17' }
  compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
  testOptions { unitTests.returnDefaultValues = true }
}

dependencies {
  implementation platform('com.google.firebase:firebase-bom:34.2.0')
  implementation 'com.google.firebase:firebase-auth'
  implementation 'com.google.firebase:firebase-firestore'
  implementation 'com.google.firebase:firebase-functions'
  implementation 'com.google.firebase:firebase-messaging'
  implementation 'com.google.firebase:firebase-storage'
  implementation 'com.google.android.gms:play-services-wearable:19.0.0'
  implementation 'androidx.activity:activity-compose:1.10.1'
  implementation 'androidx.lifecycle:lifecycle-runtime-compose:2.9.1'
  implementation 'androidx.lifecycle:lifecycle-viewmodel-compose:2.9.1'
  implementation 'androidx.navigation:navigation-compose:2.9.1'
  implementation platform('androidx.compose:compose-bom:2025.06.00')
  implementation 'androidx.compose.material3:material3'
  implementation 'androidx.compose.material:material-icons-extended'
  implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-play-services:1.10.2'
  testImplementation 'junit:junit:4.13.2'
  testImplementation 'org.jetbrains.kotlinx:kotlinx-coroutines-test:1.10.2'
}
