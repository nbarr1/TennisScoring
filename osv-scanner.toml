# Advisories osv-scanner should ignore, each with the reason and a date to revisit.
#
# The image-size entries (GHSA-5p2g-fcmc-qvqq and GHSA-w3rx-r6r6-pgpr) were
# removed on October 1, 2026: the package is no longer in pnpm-lock.yaml, and
# osv-scanner reported both ignores as unused.
#
# Two entries were removed on November 1, 2026: the braces advisory
# (GHSA-vfj7-8cjw-p6xm) was withdrawn as not practically exploitable, and
# osv-scanner reported its ignore as unused; the node-forge advisory
# (GHSA-86w9-cpqp-85rv) affects 1.4.0 and earlier, and the root package.json
# overrides node-forge to 1.4.1 or later.
#
# Template:
# [[IgnoredVulns]]
# id = "GHSA-xxxx-xxxx-xxxx"
# reason = "Why it does not apply, and when to revisit it."

[[IgnoredVulns]]
id = "GHSA-mrhx-c7xc-m3w5"
reason = "zod <4.6.6 memory exhaustion while validating oversized constrained collections. The zod 4 copy is overridden to ^4.6.6 in the root package.json; this entry covers only zod 3.25.76, which @expo/cli 57 pins (no zod 3 release is patched, and forcing zod 4 on the Expo CLI would break it). The Expo CLI runs on developer machines and EAS builders and validates its own config, not user input, and zod ships in neither app bundle nor the Cloud Functions bundle. Added October 26, 2026; revisit January 26, 2027, or as soon as an @expo/cli on zod 4.6.6 or later is published."

[[IgnoredVulns]]
id = "GHSA-gcqx-w48m-w2h4"
reason = "deepmerge mergeObject() prototype poisoning of returned objects (rated low); no patched release exists. It reaches the lockfile only through @expo/config, @react-native-community/cli-config, and jest-config, which merge the project's own configuration files on developer machines, EAS builders, and CI, never user input, and it ships in neither app bundle nor the Cloud Functions bundle. Added October 29, 2026; revisit January 29, 2027, or as soon as a fixed deepmerge is published."

[[IgnoredVulns]]
id = "GHSA-g3hv-75wg-m249"
reason = "minimatch <11.0.1 pattern amplification in firstPhasePreProcess() when optimizationLevel >= 2. The minimatch 9 and 10 copies are overridden to ^11.0.3 in the root package.json; this entry covers only minimatch 3.1.5, which eslint-plugin-import, eslint-plugin-jsx-a11y, eslint-plugin-react, test-exclude, and glob 7 (through test-exclude) depend on. minimatch 3 has neither optimizationLevel nor firstPhasePreProcess(), so the vulnerable code is absent; the advisory's range starts at 0 regardless. minimatch 11 drops the callable CommonJS export those packages require, so it cannot be forced on them. They run only in ESLint and Jest coverage on developer machines and CI, matching patterns from config files, and minimatch ships in neither app bundle nor the Cloud Functions bundle. Added November 1, 2026; revisit February 1, 2027, or as soon as those packages move off minimatch 3."
